name: DynamoDB CI

on:
  push:
    branches: [main, combined]
    paths:
      - 'dynamodb-demo/**'
      - 'agent-runner/**'
      - 'agent-config/**'
      - '.github/workflows/dynamodb-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'dynamodb-demo/**'
      - 'agent-runner/**'

jobs:
  build:
    name: Build employee API + compile self-healing agents
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test the employee API (H2)
        working-directory: dynamodb-demo
        run: mvn -B clean test

      - name: Compile the self-healing agents
        working-directory: agent-runner
        run: mvn -B clean compile
